# Tests on every PR, plus the sem dry run that tells a PR what its merge releases. A merge to main
# isn't built again here: release.yml builds it (signed, both architectures).

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per PR; a newer push cancels the older run.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Local builds sign with an Apple Development certificate when there is one; CI has none.
      MOO_SIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      - name: Lint
        run: npm run lint

      - name: Plugins (moomoi/plugins release)
        run: bash scripts/fetch-plugins.sh

      - name: Unit tests
        working-directory: packages/moo-macos
        run: cargo test --lib

      - name: App
        run: bash app/build.sh

  windows:
    name: Windows build
    # Cross-built on Linux (cheaper than a Windows runner): proves moo.exe still compiles and links.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TISH_FAST_NATIVE_BUILD: "1"
      XWIN_ACCEPT_LICENSE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cache/cargo-xwin
            target/tish-native-win
          key: moo-windows-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'packages/moo-macos/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            moo-windows-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'packages/moo-macos/Cargo.lock') }}-
            moo-windows-
      - name: Cross tools (LLVM, cargo-xwin)
        run: |
          sudo apt-get install -y clang lld llvm >/dev/null
          cargo install cargo-xwin --locked
      - name: Tish compiler and packages (npm)
        run: |
          npm ci --no-audit --no-fund
          (cd app && npm ci --no-audit --no-fund)
      - name: Package
        run: bash scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: moo-windows-x64
          path: dist/release/Moo-windows-x64.zip
          if-no-files-found: error

  release_check:
    name: Release check (sem dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Dry-run sem
        id: sem
        uses: tishlang/sem@v1
        with:
          dry_run: true
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report bump
        run: |
          if [ "${{ steps.sem.outputs.new_release_published }}" = "true" ]; then
            echo "::notice::Merging this releases Moo ${{ steps.sem.outputs.new_release_version }} (as a prerelease to promote)."
          elif [ "${{ steps.sem.outputs.skipped }}" = "true" ]; then
            echo "::notice::Soft-skipped (${{ steps.sem.outputs.skip_reason }})."
          else
            echo "::notice::No release. Conventional commits drive the version: feat, fix, perf and BREAKING CHANGE release; chore, docs, ci, refactor and test do not. See CONTRIBUTING.md."
          fi
