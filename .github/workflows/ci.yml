# Tests on every PR and main push, plus the sem dry run that tells a PR what its merge releases.
# Releasing itself is release.yml.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# PRs: one run per PR, superseded pushes cancelled. main: one run per commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Local builds sign with an Apple Development certificate when there is one; CI has none.
      MOO_SIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      - name: Plugins
        run: bash plugins/build.sh

      - name: Unit tests
        working-directory: packages/moo-macos
        run: cargo test --lib

      - name: App
        run: bash app/build.sh

  release_check:
    name: Release check (sem dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Dry-run sem
        id: sem
        uses: tishlang/sem@v1
        with:
          dry_run: true
          config: |
            branches: [main]
            plugins:
              - "@sem/commit-analyzer"
              - "@sem/release-notes-generator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report bump
        run: |
          if [ "${{ steps.sem.outputs.new_release_published }}" = "true" ]; then
            echo "::notice::Merging this releases Moo ${{ steps.sem.outputs.new_release_version }} (as a prerelease to promote)."
          elif [ "${{ steps.sem.outputs.skipped }}" = "true" ]; then
            echo "::notice::Soft-skipped (${{ steps.sem.outputs.skip_reason }})."
          else
            echo "::notice::No release. Conventional commits drive the version: feat, fix, perf and BREAKING CHANGE release; chore, docs, ci, refactor and test do not. See CONTRIBUTING.md."
          fi
