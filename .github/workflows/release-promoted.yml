# When a prerelease is promoted to a full release (Edit release -> uncheck "Set as a pre-release"):
#   - rewrite the release notes to cover everything since the last full release (a promoted
#     prerelease's own notes only cover the commits since the previous prerelease)
#   - trigger the Homebrew tap (moomoi/homebrew-moo) to regenerate Casks/moo.rb
#
# The tap lives in another repo, so the dispatch uses a GitHub App token (secrets:
# MOO_RELEASE_APP_ID + MOO_RELEASE_APP_PRIVATE_KEY) installed on moomoi/homebrew-moo with
# contents: write.

name: Release promoted

on:
  release:
    types: [released, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)run for, e.g. v0.4.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-promoted
  cancel-in-progress: false

env:
  TAP_REPO: moomoi/homebrew-moo

jobs:
  publish:
    # Only full releases. Editing a prerelease's notes fires `edited` too; it is skipped here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.prerelease == false && github.event.release.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag and version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Release notes since the last full release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          # The newest full release other than this one.
          LAST_PUBLIC=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq "[.[] | select(.draft==false and .prerelease==false and .tag_name!=\"$TAG\")][0].tag_name" 2>/dev/null || echo "")
          echo "Last public release: ${LAST_PUBLIC:-<none>}"
          if [ -n "$LAST_PUBLIC" ] && [ "$LAST_PUBLIC" != "$TAG" ] && git rev-parse -q --verify "refs/tags/$LAST_PUBLIC" >/dev/null; then
            RANGE="$LAST_PUBLIC..$TAG"
          else
            RANGE="$TAG"
          fi
          # User-facing changes only: what conventional commits say shipped.
          LOG=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep -E '^(feat|fix|perf)(\(.+\))?!?:' | sed 's/^/- /' || true)
          [ -z "$LOG" ] && LOG="- Maintenance release"
          {
            echo "## Moo $TAG"
            echo ""
            echo "**Install:** download \`Moo-macos-universal.dmg\`, open it and drag Moo to Applications (Apple silicon and Intel, macOS 14 or later)."
            echo "Or with Homebrew: \`brew install moomoi/moo/moo\`"
            echo ""
            if [ -n "$LAST_PUBLIC" ] && [ "$LAST_PUBLIC" != "$TAG" ]; then echo "### Changes since ${LAST_PUBLIC}"; else echo "### Changes"; fi
            echo ""
            echo "$LOG"
          } > public-notes.md
          cat public-notes.md

      - name: Update this release's notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --title "Moo ${{ steps.ver.outputs.tag }}" --notes-file public-notes.md

      - name: Mint GitHub App token (tap)
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MOO_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOO_RELEASE_APP_PRIVATE_KEY }}
          owner: moomoi
          repositories: |
            homebrew-moo

      - name: Trigger the Homebrew tap bump
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          curl -sS --fail -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TAP_REPO}/dispatches" \
            -d "$(jq -n --arg v "${{ steps.ver.outputs.version }}" --arg r "$GITHUB_REPOSITORY" \
              '{event_type:"release", client_payload:{version:$v, source_repo:$r}}')"
          echo "Dispatched the tap bump for ${{ steps.ver.outputs.version }}"
