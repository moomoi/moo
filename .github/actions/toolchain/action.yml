name: Moo toolchain
description: >-
  Rust (both Mac targets) and the tish compiler from npm (package.json), with the cargo registry
  and Moo's native builds cached. Exports TISH for app/build.sh.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin,x86_64-apple-darwin

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: |
          package-lock.json
          app/package-lock.json

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
          packages/moo-macos/target
        key: moo-native-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'packages/moo-macos/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          moo-native-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'packages/moo-macos/Cargo.lock') }}-
          moo-native-${{ runner.os }}-

    - name: Tish compiler and packages (npm)
      shell: bash
      run: |
        npm ci --no-audit --no-fund
        (cd app && npm ci --no-audit --no-fund)
        echo "TISH=$PWD/node_modules/.bin/tish" >> "$GITHUB_ENV"
        node_modules/.bin/tish --version
