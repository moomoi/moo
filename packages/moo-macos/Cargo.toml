[package]
name = "moo_macos"
version = "0.1.0"
edition = "2021"
description = "Moo launcher natives for macOS, exposed to Tish as a native module"
license = "MIT"

[dependencies]
# crates.io, at the version of the tish compiler (package.json): the code it generates and
# @tishlang/tish-macos depend on the same registry crates, so everything shares one tishlang_core.
tishlang_core = { version = "3.15.2" }
tishlang_ui = { version = "3.15.2", default-features = false, features = ["runtime"] }
nucleo-matcher = "0.3"
# Tier A plugins: bytecode chunks in a capability-free VM.
# `send-values` must match the app build, which enables it on tishlang_core (http implies it).
tishlang_vm = { version = "3.15.2", features = ["send-values"] }
tishlang_bytecode = { version = "3.15.2" }

[dev-dependencies]
tishlang_parser = { version = "3.15.2" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSGeometry", "NSNotification", "NSOperation", "NSTimer", "NSDate", "NSProcessInfo", "NSTimeZone", "NSFileManager", "NSError", "NSData", "block2"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSWindow",
    "NSPanel",
    "NSAppearance",
    "NSColor",
    "NSGlassEffectView",
    "NSView",
    "NSResponder",
    "NSEvent",
    "NSScreen",
    "NSButton",
    "NSControl",
    "NSTextField",
    "NSWorkspace",
    "NSPasteboard",
    "NSImage",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSVisualEffectView",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "block2",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "objc2-core-foundation"] }
block2 = "0.6"
dispatch2 = "0.3"
